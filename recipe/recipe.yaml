schema_version: 1

context:
  python_min: "3.9.6"
  name: nomad-camels-driver-demo-instrument
  version: "0.1.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/nomad_camels_driver_demo_instrument-${{ version }}.tar.gz
  sha256: 2ed19f101be0f2be8fe97904048d29b1690af36867285b73636f748732bdbe5e

build:
  number: 3
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python 3.9.6.*
    - setuptools >=61.0
    - pip
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - nomad_camels_driver_demo_instrument
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: This packes provides everything to run a demo instrument for CAMELS
  license: LGPL-2.1-or-later
  license_file: LICENSE.txt
  homepage: https://github.com/FAU-LAP/CAMELS_drivers

extra:
  recipe-maintainers:
    - jan-janssen
